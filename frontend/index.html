<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ForumA — Diễn đàn nội bộ doanh nghiệp, kết nối và chia sẻ tri thức." />
  <title>ForumA — Forum Nội Bộ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Socket.IO client (served by server) -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Notification dropdown -->
  <div id="notif-dropdown" class="notif-dropdown hidden"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="modal-box">
      <div id="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" aria-label="Đóng">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-footer"></div>
    </div>
  </div>

  <!-- SPA root -->
  <div id="app"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
